# Optional named PVC alternative to PipelineRun volumeClaimTemplate.
# Prefer volumeClaimTemplate in pipelinerun.example.yaml / deploy.sh for per-run cleanup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redhat-screensaver-source-pvc
  labels:
    app: redhat-screensaver
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
