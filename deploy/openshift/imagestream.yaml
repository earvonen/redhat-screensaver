# ImageStream for the screensaver container image.
# After a successful push from Tekton to
# image-registry.openshift-image-registry.svc:5000/<namespace>/redhat-screensaver:<tag>,
# OpenShift will record tags here (local lookup policy optional).
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: redhat-screensaver
  labels:
    app: redhat-screensaver
spec:
  lookupPolicy:
    local: true
