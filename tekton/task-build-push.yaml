# Build and push using Kaniko (no privileged container). Bind a dockerconfigjson Secret
# to the dockerconfig workspace so pushes to the internal registry can authenticate.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: redhat-screensaver-build-push
  labels:
    app: redhat-screensaver
spec:
  description: Build image with Kaniko and push to registry (non-privileged)
  workspaces:
    - name: source
      description: Repository root containing Containerfile
    - name: dockerconfig
      description: >
        Secret type kubernetes.io/dockerconfigjson (key .dockerconfigjson).
        On OpenShift, use the pipeline SA dockercfg secret (oc describe sa pipeline).
  params:
    - name: IMAGE
      type: string
      description: Full image reference (registry/namespace/name:tag)
    - name: CONTAINERFILE
      type: string
      default: Containerfile
  volumes:
    - name: kaniko-docker-config
      emptyDir: {}
  steps:
    - name: prepare-docker-config
      image: registry.access.redhat.com/ubi9/ubi-micro:latest
      securityContext:
        allowPrivilegeEscalation: false
      script: |
        #!/bin/sh
        set -eu
        SRC="$(workspaces.dockerconfig.path)/.dockerconfigjson"
        if [ ! -f "$SRC" ]; then
          echo "Missing .dockerconfigjson in dockerconfig workspace (use a dockerconfigjson Secret)."
          exit 1
        fi
        cp "$SRC" /tmp/kaniko-docker/config.json
      volumeMounts:
        - name: kaniko-docker-config
          mountPath: /tmp/kaniko-docker
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      securityContext:
        allowPrivilegeEscalation: false
      env:
        - name: DOCKER_CONFIG
          value: /tmp/kaniko-docker
      args:
        - --dockerfile=$(params.CONTAINERFILE)
        - --context=dir://$(workspaces.source.path)
        - --destination=$(params.IMAGE)
        - --skip-tls-verify
      volumeMounts:
        - name: kaniko-docker-config
          mountPath: /tmp/kaniko-docker
          readOnly: true
