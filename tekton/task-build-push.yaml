# Build from a workspace (Containerfile) and push to a container registry (OpenShift internal registry + ImageStream).
# Requires a ServiceAccount with permission to push (e.g. system:image-pusher on the namespace).
# The build step uses privileged mode, which many clusters allow for the pipelines ServiceAccount.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: redhat-screensaver-build-push
  labels:
    app: redhat-screensaver
spec:
  description: Build image with buildah and push to registry
  workspaces:
    - name: source
      description: Repository root containing Containerfile
  params:
    - name: IMAGE
      type: string
      description: Full image reference (registry/namespace/name:tag)
    - name: CONTAINERFILE
      type: string
      default: Containerfile
  steps:
    - name: build-and-push
      image: registry.redhat.io/ubi9/buildah:latest
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      env:
        - name: STORAGE_DRIVER
          value: vfs
      script: |
        #!/bin/bash
        set -euo pipefail
        IMAGE="$(params.IMAGE)"
        buildah bud \
          --storage-driver=vfs \
          --format=docker \
          --tls-verify=false \
          -f "$(params.CONTAINERFILE)" \
          -t "${IMAGE}" \
          .
        buildah push \
          --storage-driver=vfs \
          --tls-verify=false \
          "${IMAGE}" \
          "docker://${IMAGE}"
