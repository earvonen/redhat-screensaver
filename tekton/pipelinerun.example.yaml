# Example PipelineRun — copy, set namespace, and apply after ImageStream + Pipeline + Tasks exist.
# Grant the ServiceAccount image pusher role, for example:
#   oc policy add-role-to-user system:image-pusher system:serviceaccount:YOUR_NS:pipeline -n YOUR_NS
#
# dockerconfig: bind a kubernetes.io/dockerconfigjson Secret. On OpenShift, find the pipeline SA token:
#   oc describe sa pipeline -n YOUR_NS
# Look for a Secret named like pipeline-dockercfg-xxxxx (type kubernetes.io/dockercfg may need conversion;
# prefer creating: oc create secret docker-registry regcred ... or link the internal registry pull secret).
#
# shared-workspace: the Pipeline clones the Git repo here, then Kaniko builds from it. emptyDir is enough.
# Alternatively use a PVC if you need a larger disk or to debug the workspace across retries.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: redhat-screensaver-build-
  labels:
    app: redhat-screensaver
spec:
  pipelineRef:
    name: redhat-screensaver-build
  serviceAccountName: pipeline
  # Optional; Pipeline defaults push to:
  # image-registry.openshift-image-registry.svc:5000/<this-namespace>/redhat-screensaver:latest
  # params:
  #   - name: image-tag
  #     value: "1.0.0"
  workspaces:
    - name: shared-workspace
      emptyDir: {}
    - name: dockerconfig
      secret:
        secretName: REPLACE_WITH_DOCKERCONFIGJSON_SECRET
