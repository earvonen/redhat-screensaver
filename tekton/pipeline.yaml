# Pipeline: build container image from source workspace and push to the OpenShift internal registry
# targeting the redhat-screensaver ImageStream (same name:tag as metadata.name + spec tag).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: redhat-screensaver-build
  labels:
    app: redhat-screensaver
spec:
  description: Build and push redhat-screensaver image to ImageStream
  params:
    - name: image-registry
      type: string
      description: Registry host (OpenShift internal)
      default: image-registry.openshift-image-registry.svc:5000
    - name: image-name
      type: string
      default: redhat-screensaver
    - name: image-tag
      type: string
      default: latest
    - name: containerfile
      type: string
      default: Containerfile
  workspaces:
    - name: shared-workspace
      description: Source code including Containerfile
  tasks:
    - name: build-and-push
      taskRef:
        name: redhat-screensaver-build-push
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: $(params.image-registry)/$(context.pipelineRun.namespace)/$(params.image-name):$(params.image-tag)
        - name: CONTAINERFILE
          value: $(params.containerfile)
