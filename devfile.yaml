schemaVersion: 2.2.2
metadata:
  name: redhat-screensaver
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.26
      endpoints:
        - exposure: public
          name: nodejs
          protocol: https
          targetPort: 3000
      memoryLimit: '1Gi'
      memoryRequest: '512Mi'
      cpuLimit: '0.1'
      cpuRequest: '0.1'
      mountSources: true
      volumeMounts:
        - name: npm
          path: /home/user/.npm
  - name: npm
    volume:
      size: 1G
commands:
  - id: 1-dependencies
    exec:
      label: "Download dependencies"
      component: tools
      workingDir: ${PROJECTS_ROOT}/redhat-screensaver
      commandLine: "npm install"
      group:
        kind: build
  - id: 2-run
    exec:
      label: "Run the web app"
      component: tools
      workingDir: ${PROJECTS_ROOT}/redhat-screensaver
      commandLine: "npm start"
      group:
        kind: run
  - id: 3-install-and-run
    exec:
      label: "Run the web app (and download dependencies)"
      component: tools
      workingDir: ${PROJECTS_ROOT}/redhat-screensaver
      commandLine: "npm install && npm start"
      group:
        kind: run
  - id: 4-debug
    exec:
      label: "Run the web app (debugging enabled)"
      component: tools
      workingDir: ${PROJECTS_ROOT}/redhat-screensaver
      commandLine: "node --inspect=0.0.0.0:9229 server/index.js"
      group:
        kind: debug
        isDefault: true
  - id: 5-stopapp
    exec:
      label: "Stop the web app"
      component: tools
      workingDir: ${PROJECTS_ROOT}/redhat-screensaver
      commandLine: "pids=$(pgrep -f '[n]ode.*server/index.js' || true); if [ -n \"$pids\" ]; then echo \"Stopping Node server PIDs: $pids\"; kill -TERM $pids 2>/dev/null || true; else echo \"No matching server process.\"; fi"
      group:
        kind: run
