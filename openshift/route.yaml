# Exposes the Service on the cluster ingress. OpenShift assigns a hostname if spec.host is omitted.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: redhat-screensaver
  labels:
    app: redhat-screensaver
spec:
  to:
    kind: Service
    name: redhat-screensaver
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
